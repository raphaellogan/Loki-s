<style>
body{
    margin:0;
    background:#F3F4F6;
    font-family:"Segoe UI",sans-serif;
}

/* Layout */

.layout{
    display:flex;
}

/* Sidebar */

.sidebar{
    position:fixed;
    top:0;
    left:0;

    width:230px;
    height:100vh;

    background:#1F2937;

    display:flex;
    flex-direction:column;

    overflow-y:auto;

    box-shadow:4px 0 18px rgba(0,0,0,.15);
}

/* Logo */

.logo{
    text-align:center;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo img{
    width:55px;
    margin-bottom:8px;
}

.logo h5{
    color:white;
    margin:0;
    font-weight:700;
}

.logo small{
    color:#9CA3AF;
    font-size:.75rem;
}

/* Menu */

.menu{
    flex:1;
    padding:12px;
}

.titulo-menu{
    display:block;
    color:#6B7280;
    font-size:.70rem;
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:10px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;

    padding:9px 12px;
    margin-bottom:4px;

    border-radius:8px;

    text-decoration:none;
    color:#E5E7EB;

    transition:.2s;
}

.menu a i{
    width:20px;
    text-align:center;
    font-size:1rem;
}

.menu a:hover{
    background:#374151;
    color:white;
}

.menu a.ativo{

    background:#F8FAFC;

    color:#2563EB;

    font-weight:600;

}

.menu a.ativo i{
    color:#2563EB;
}
/* Usuário */

.usuario{
    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    border-top:1px solid rgba(255,255,255,.08);
}

.perfil{
    width:38px;
    height:38px;

    border-radius:50%;

    background:#2563EB;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:1rem;
}

.usuario strong{
    color:white;
    font-size:.9rem;
}

.usuario small{
    color:#9CA3AF;
    font-size:.75rem;
}

/* Conteúdo */

.conteudo{
    margin-left:230px;

    width:calc(100% - 230px);

    min-height:100vh;

    padding:25px;

    background:#F3F4F6;
}
</style>
<div class="layout">

    <aside class="sidebar">

        <!-- Logo -->

        <div class="logo">

            <img src="./public/logo.png" alt="Logo">

            <h5 class="mb-1">OrganizeEPI</h5>

            <small>Sistema de Gestão de EPIs</small>

        </div>

        <!-- Menu -->

        <nav class="menu">

            <span class="titulo-menu">
                MENU
            </span>

            <a data-pagina="dashboard" href="../pages/funcionarios/meus-epis.html" onclick="navegar(event, `dashboard`)" class="">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a data-pagina="meus-epis" href="../pages/funcionarios/meus-epis.html" onclick="navegar(event, 'meus-epis')">
                <i class="bi bi-shield-check"></i>
                Meus EPIs
            </a>

            <a data-pagina="solicitar" href="../pages/funcionarios/solicitar.html" onclick="navegar(event, 'solicitar')">
                <i class="bi bi-box-seam"></i>
                Solicitar
            </a>

            <a data-pagina="devolver" href="../pages/funcionarios/devolver.html" onclick="navegar(event, 'devolver')">
                <i class="bi bi-clipboard-check"></i>
                Devolver
            </a>

            <a data-pagina="historico" href="../pages/funcionarios/historico.html" onclick="navegar(event, 'historico')">
                <i class="bi bi-gear-fill"></i>
                Histórico
            </a>

            <a data-pagina="configuracoes" href="../pages/configuracoes.html" onclick="navegar(event, 'configuracoes')">
                <i class="bi bi-gear-fill"></i>
                Configurações
            </a>

        </nav>

        <!-- Usuário -->

        <div class="usuario">

            <div class="perfil">
                <i class="bi bi-person-fill"></i>
            </div>

            <div>

                <strong>Funcionário</strong>

                <br>

                <small>Gustavo - Online</small>

            </div>

        </div>

    </aside>

    <!--conteudo será inserido aqui-->
    <main id="conteudo" class="conteudo">

    </main>

</div>
