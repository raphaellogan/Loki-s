<style>
body{
    background:#EDF4F8;
}

.login-container{
    min-height:100vh;
}

.login-content{
    width:100%;
    max-width:420px;
}

.logo-circle{
    width:75px;
    height:75px;
    background:#0d6efd;
    color:white;
    font-size:32px;
}

.title{
    font-size:2rem;
}

.subtitle{
    color:#6c757d;
}

.form-control{
    height:50px;
    border-radius:12px;
}

.input-group-text{
    background:white;
    border-radius:12px 0 0 12px;
}

.input-group .form-control{
    border-left:0;
}

.input-group .form-control:focus{
    box-shadow:none;
    border-color:#dee2e6;
}

.btn-login{
    height:52px;
    border-radius:12px;
    font-weight:600;
    font-size:1.05rem;
}

.link-login{
    text-decoration:none;
}

.link-login:hover{
    text-decoration:underline;
}

@media(min-width:992px){

    .login-content{
        background:white;
        padding:50px;
        border-radius:25px;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

}

@media(max-width:991px){

    .login-content{
        padding:30px 25px;
    }

}
</style>


<div class="container login-container d-flex justify-content-center align-items-center">

    <div class="login-content">

        <div class="text-center mb-5">

            <div class="logo-circle rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3">

                <i class="bi bi-shield-check"></i>

            </div>

            <h1 class="title fw-bold mb-2">
                OrganizeEPI
            </h1>

            <p class="subtitle">
                Gestão inteligente de equipamentos de proteção
            </p>

        </div>


        <form id="formLogin">

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    E-mail
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        id="email"
                        type="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        required>

                </div>

            </div>


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Senha
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        id="senha"
                        type="password"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required>

                </div>

            </div>


            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="lembrar">

                    <label
                        class="form-check-label"
                        for="lembrar">

                        Lembrar-me

                    </label>

                </div>


                <a href="#" class="link-login">
                    Esqueci a senha
                </a>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100 btn-login">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Entrar

            </button>

        </form>


        <div class="text-center mt-5">

            <span class="text-secondary">
                Ainda não possui acesso?
            </span>

            <a href="/cadastro" onclick="navegar(event, 'cadastro')" class="link-login">
                Solicitar cadastro
            </a>

        </div>

    </div>

</div>


<script>

(() => {

    const form = document.getElementById("formLogin");

    form.addEventListener("submit", async function(evento) {

        evento.preventDefault();

        const dados = {

            email: document
                .getElementById("email")
                .value
                .trim(),

            senha: document
                .getElementById("senha")
                .value

        };

        try {

            const resposta = await fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(dados)

            });

            const resultado = await resposta
                .json()
                .catch(() => ({}));


            if (resposta.ok) {

                alert("Login realizado:", resultado);

                // Depois você pode redirecionar conforme o perfil
                // Exemplo:
                //
                // history.pushState(null, "", "/dashboard");
                // await carregarPagina("dashboard");

            } else {

                alert(
                    resultado.mensagem ||
                    resultado.erro ||
                    "E-mail ou senha inválidos."
                );

            }

        } catch (erro) {

            console.error("Erro no login:", erro);

            alert("Não foi possível conectar ao servidor.");

        }

    });

})();

</script>
